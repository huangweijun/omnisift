name: OmniSift
options:
  bundleIdPrefix: com.omnisift
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  defaultConfig: Release
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"

packages:
  CoreMLLLM:
    url: https://github.com/john-rocky/CoreML-LLM
    from: "0.5.0"
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios
    from: "5.0.0"

targets:
  OmniSift:
    type: application
    platform: iOS
    productName: OmniSift
    sources:
      - path: OmniSift
      - path: Shared
      - path: Models
        type: folder
        buildPhase: resources
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.omnisift.app
        PRODUCT_NAME: OmniSift
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "知漏"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.productivity"
        CODE_SIGN_ENTITLEMENTS: OmniSift/OmniSift.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
    entitlements:
      path: OmniSift/OmniSift.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.omnisift.shared
        com.apple.developer.kernel.increased-memory-limit: true
    dependencies:
      - target: ShareExtension
      - package: CoreMLLLM
      - package: RevenueCat
        product: RevenueCat
      - package: RevenueCat
        product: RevenueCatUI

  ShareExtension:
    type: app-extension
    platform: iOS
    productName: ShareExtension
    sources:
      - path: ShareExtension
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.omnisift.app.share
        PRODUCT_NAME: ShareExtension
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "知漏分享"
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.share-services
        CODE_SIGN_ENTITLEMENTS: ShareExtension/ShareExtension.entitlements
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.omnisift.shared
    info:
      path: ShareExtension/Info.plist
